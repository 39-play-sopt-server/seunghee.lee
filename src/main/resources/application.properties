spring.application.name=assignment

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/assignment?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=1800000
jwt.refresh-token-expiration=1209600000
jwt.refresh-token-cookie-name=refresh-token
jwt.refresh-token-cookie-secure=${JWT_REFRESH_COOKIE_SECURE:false}
